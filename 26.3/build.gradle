plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = "${mod_version}+26.3"

dependencies {
    minecraft "com.mojang:minecraft:26.3"

    // 26.x ships an unobfuscated jar and Mojang publishes no mappings for it, but loom refuses to
    // configure a project whose `mappings` configuration is empty and always reads the dependency as a
    // jar (mappings/mappings.tiny). `mappings/identity.jar` is such a jar containing an empty tiny v2
    // mapping, i.e. an identity mapping: it satisfies loom and leaves every name untouched.
    mappings files('mappings/identity.jar')
    modImplementation "net.fabricmc:fabric-loader:0.20.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.166.2+26.3"

    // Minecraft itself is compiled against these annotations; javac wants them on the classpath.
    compileOnly 'org.jspecify:jspecify:1.0.0'
    compileOnly 'org.jetbrains:annotations:26.0.1'
}

// Shared sources live one level up: common/ (all four versions) and common26/ (the three 26.x
// versions). Only the files that really differ per version are kept in this folder, so the four
// versions no longer duplicate ~70 identical classes and ~150 identical assets.
sourceSets {
    main {
        java { srcDirs = ['../common/src', '../common26/src', 'src'] }
        resources { srcDirs = ['../common/resources', '../common26/resources', 'resources'] }
    }
}

loom {
    mods {
        heavygear {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
