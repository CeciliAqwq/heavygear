plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = "${mod_version}+1.21.11"

dependencies {
    // 1.21.11 is obfuscated, so the official Mojang mappings are required.
    mappings loom.officialMojangMappings()
    minecraft "com.mojang:minecraft:1.21.11"
    modImplementation "net.fabricmc:fabric-loader:0.19.5"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"

    // Minecraft itself is compiled against these annotations; javac wants them on the classpath.
    compileOnly 'org.jspecify:jspecify:1.0.0'
    compileOnly 'org.jetbrains:annotations:26.0.1'
}

// Shared sources live one level up: common/ (all four versions) and common26/ (the three 26.x
// versions). Only the files that really differ per version are kept in this folder, so the four
// versions no longer duplicate ~70 identical classes and ~150 identical assets.
sourceSets {
    main {
        java { srcDirs = ['../common/src', 'src'] }
        resources { srcDirs = ['../common/resources', 'resources'] }
    }
}

loom {
    mods {
        heavygear {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}
