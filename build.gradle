// Shared build configuration. Every Minecraft version is its own subproject because the sources
// are ported against different Minecraft APIs.

subprojects {
    apply plugin: 'java'

    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
    }

    // Each version folder holds "src/" and "resources/" directly (no src/main/java nesting).
    sourceSets {
        main {
            java { srcDirs = ['src'] }
            resources { srcDirs = ['resources'] }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    // Keep the shipped jar name stable: heavygear-<mod version>+<mc version>.jar
    base {
        archivesName = 'heavygear'
    }
}
